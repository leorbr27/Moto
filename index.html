<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moto — Abastecimento</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="ey">CONTROLE DA MOTO</div><h1>🏍️ Novo abastecimento</h1></header><main><nav class="nav"><a data-p="fuel" href="index.html">⛽ Abastecer</a><a data-p="maint" href="manutencao.html">🔧 Manutenção</a><a data-p="exp" href="despesas.html">💰 Despesas</a><a data-p="hist" href="historico.html">📋 Histórico</a><a data-p="moto" href="moto.html">🏍️ Minha moto</a></nav><section class="card"><div class="head"><h2>Registrar abastecimento</h2></div><form id="form" class="form" style="margin-top:14px"><div class="field"><label>Data</label><input name="date" type="date" required value="2026-10-01"></div><div class="field"><label>Quilometragem (km)</label><input name="km" type="number" min="0" required></div><div class="field"><label>Valor abastecido (R$)</label><input name="total" type="number" min="0" step=".01" required></div><div class="field"><label>Preço por litro (R$)</label><input name="pl" type="number" min=".001" step=".001" required></div><div class="field"><label>Combustível</label><select name="type"><option>Gasolina comum</option><option>Gasolina aditivada</option><option>Etanol</option><option>Gasolina premium</option></select></div><div class="field"><label>Posto</label><input name="station"></div><div class="field"><label>Observações</label><textarea name="notes"></textarea></div><button class="btn primary">💾 Salvar abastecimento</button></form></section><section id="last"></section></main><div id="toast" class="toast"></div><script src="app.js"></script><script>nav("fuel");document.querySelector('[name=km]').value=currentKm();document.getElementById("form").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),total=+f.get("total"),pl=+f.get("pl"),o={id:uid(),date:f.get("date"),km:+f.get("km"),total,pl,liters:total/pl,type:f.get("type"),station:f.get("station"),notes:f.get("notes")};const arr=db.fuel.concat(o).sort((a,b)=>a.km-b.km);arr.forEach((x,i)=>{const p=arr[i-1];x.distance=p?x.km-p.km:null;x.consumption=p&&x.liters?x.distance/x.liters:null});db.fuel=arr;save();toast("Abastecimento salvo");e.target.reset();e.target.date.value=today();e.target.km.value=currentKm();renderLast()};function renderLast(){const x=db.fuel.slice().sort((a,b)=>b.km-a.km)[0];document.getElementById("last").innerHTML=x?'<div class="card"><b>Último abastecimento</b><div class="meta">'+dateBR(x.date)+' · '+x.km.toLocaleString("pt-BR")+' km · '+x.liters.toFixed(2)+' L</div><div class="value" style="margin-top:6px">'+money(x.total)+(x.consumption?' · '+x.consumption.toFixed(2)+' km/L':'')+'</div></div>':''}renderLast();</script></body></html>
