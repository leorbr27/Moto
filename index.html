<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Moto — Controle de gastos</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--txt:#111827;--muted:#6b7280;--line:#e5e7eb;--blue:#2563eb;--red:#dc2626;--green:#059669}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:#111827;color:#fff;padding:15px max(15px,calc((100% - 1000px)/2));display:flex;justify-content:space-between;align-items:center}.top h1{margin:2px 0;font-size:22px}.ey{font-size:10px;letter-spacing:1.5px;color:#9ca3af;font-weight:700}.icon{border:0;border-radius:10px;background:#ffffff18;color:#fff;width:40px;height:40px;font-size:18px}main{max-width:1000px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:0 6px 22px #0f172a0b}.hero{margin-bottom:12px}.herorow{display:flex;justify-content:space-between;gap:12px}.hero h2{margin:3px 0;font-size:22px}.muted{color:var(--muted)}.km{font-size:25px;font-weight:800;text-align:right}.km small{display:block;font-size:10px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 12px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px}.tab.on{background:#111827;color:#fff}.page{display:none}.page.on{display:block}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:7px 0 12px}.head h2{font-size:19px;margin:0}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700}.primary{background:var(--blue);color:#fff}.danger{background:#fee2e2;color:#991b1b}.secondary{background:#eef2ff;color:#3730a3}.small{padding:6px 9px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px}.stat b{font-size:20px;display:block;margin-top:4px}.stat span{font-size:11px;color:var(--muted)}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.row h3{font-size:15px;margin:0}.meta{font-size:12px;color:var(--muted);line-height:1.55;margin-top:4px}.value{font-weight:800;white-space:nowrap;text-align:right}.actions{display:flex;gap:5px;justify-content:flex-end;margin-top:8px}.empty{text-align:center;color:var(--muted);padding:28px}.alert{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:11px;padding:12px;margin-bottom:10px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.filters input,.filters select,input,select,textarea{border:1px solid #d1d5db;border-radius:10px;padding:10px;background:#fff;width:100%;font:inherit}label{font-size:12px;font-weight:700;color:#374151}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:grid;gap:5px}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}.modal.hide{display:none}.box{background:#fff;width:min(650px,100%);max-height:94vh;overflow:auto;border-radius:19px 19px 0 0;padding:17px}.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.mhead h2{margin:0;font-size:19px}.close{border:0;background:#f3f4f6;border-radius:9px;width:36px;height:36px}.submit{grid-column:1/-1;display:flex;justify-content:flex-end;gap:7px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:#111827;color:#fff;padding:10px 15px;border-radius:10px;opacity:0;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full,.submit{grid-column:auto}.herorow{align-items:flex-start}.row{padding:0}.value{font-size:14px}}
</style></head>
<body><header class="top"><div><div class="ey">CONTROLE DA MOTO</div><h1>🏍️ Moto</h1></div><button class="icon" id="cfg">⚙️</button></header>
<main><div id="vehicle" class="card hero"></div><nav class="tabs"><button class="tab on" data-p="dash">Resumo</button><button class="tab" data-p="fuel">⛽ Abastecimentos</button><button class="tab" data-p="maint">🔧 Manutenções</button><button class="tab" data-p="exp">💰 Despesas</button><button class="tab" data-p="hist">📋 Histórico</button></nav>
<section id="dash" class="page on"></section><section id="fuel" class="page"></section><section id="maint" class="page"></section><section id="exp" class="page"></section><section id="hist" class="page"></section></main>
<div id="modal" class="modal hide"><div class="box"><div class="mhead"><h2 id="mtitle"></h2><button class="close" id="mclose">✕</button></div><div id="mbody"></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY="moto_v1";let db;try{db=JSON.parse(localStorage.getItem(KEY))||{vehicle:null,fuel:[],maint:[],exp:[]}}catch(e){db={vehicle:null,fuel:[],maint:[],exp:[]}}
const $=id=>document.getElementById(id), money=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2), today=()=>new Date().toISOString().slice(0,10), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])), dateBR=s=>s?new Date(s+"T12:00:00").toLocaleDateString("pt-BR"):"—";
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function km(){return Math.max(db.vehicle?.initialKm||0,...db.fuel.map(x=>+x.km||0),...db.maint.map(x=>+x.km||0),...db.exp.map(x=>+x.km||0))}
function modal(t,h){$("mtitle").textContent=t;$("mbody").innerHTML=h;$("modal").classList.remove("hide")}function close(){ $("modal").classList.add("hide")}$("mclose").onclick=close;
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1700)}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));$(b.dataset.p).classList.add("on")});
function vehicleForm(){let v=db.vehicle||{};modal("Cadastro da moto",'<form id="vf" class="form"><div class="field"><label>Marca</label><input name="brand" required value="'+esc(v.brand||"")+'" placeholder="Honda"></div><div class="field"><label>Modelo</label><input name="model" required value="'+esc(v.model||"")+'" placeholder="CB 500F"></div><div class="field"><label>Ano de fabricação</label><input name="yf" type="number" required value="'+(v.yf||new Date().getFullYear())+'"></div><div class="field"><label>Ano do modelo</label><input name="ym" type="number" required value="'+(v.ym||new Date().getFullYear())+'"></div><div class="field"><label>Placa (opcional)</label><input name="plate" value="'+esc(v.plate||"")+'"></div><div class="field"><label>KM atual/inicial</label><input name="ikm" type="number" min="0" value="'+(v.ikm||0)+'"></div><div class="field"><label>Combustível</label><select name="ft"><option>Gasolina</option><option '+(v.ft==="Etanol"?"selected":"")+'>Etanol</option><option '+(v.ft==="Flex"?"selected":"")+'>Flex</option></select></div><div class="field full"><label>Observações</label><textarea name="notes">'+esc(v.notes||"")+'</textarea></div><div class="submit"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Salvar</button></div></form>');$("cancel").onclick=close;$("vf").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.vehicle={brand:f.get("brand"),model:f.get("model"),yf:+f.get("yf"),ym:+f.get("ym"),plate:f.get("plate"),ikm:+f.get("ikm")||0,ft:f.get("ft"),notes:f.get("notes")};save();close();toast("Moto cadastrada")}}
function fuelForm(id){let x=id&&db.fuel.find(a=>a.id===id);modal(id?"Editar abastecimento":"Novo abastecimento",'<form id="ff" class="form"><div class="field"><label>Data</label><input name="date" type="date" required value="'+(x?.date||today())+'"></div><div class="field"><label>Quilometragem (km)</label><input name="km" type="number" min="0" required value="'+(x?.km??km())+'"></div><div class="field"><label>Valor abastecido (R$)</label><input name="total" type="number" min="0" step=".01" required value="'+(x?.total??"")+'"></div><div class="field"><label>Preço do litro (R$)</label><input name="pl" type="number" min=".001" step=".001" required value="'+(x?.pl??"")+'"></div><div class="field"><label>Combustível</label><select name="type"><option>Gasolina comum</option><option>Gasolina aditivada</option><option>Etanol</option><option>Gasolina premium</option></select></div><div class="field"><label>Posto</label><input name="station" value="'+esc(x?.station||"")+'"></div><div class="field full"><label>Observações</label><textarea name="notes">'+esc(x?.notes||"")+'</textarea></div><div class="submit"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Salvar</button></div></form>');$("cancel").onclick=close;$("ff").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),total=+f.get("total"),pl=+f.get("pl"),obj={id:id||uid(),date:f.get("date"),km:+f.get("km"),total,pl,liters:total/pl,type:f.get("type"),station:f.get("station"),notes:f.get("notes")};let arr=db.fuel.filter(a=>a.id!==id).concat(obj).sort((a,b)=>a.km-b.km);arr.forEach((a,i)=>{let p=arr[i-1];a.distance=p?a.km-p.km:null;a.consumption=p&&a.liters?a.distance/a.liters:null});db.fuel=arr;save();close();toast("Abastecimento salvo")}}
function maintForm(id){let x=id&&db.maint.find(a=>a.id===id);modal(id?"Editar manutenção":"Nova manutenção",'<form id="mf" class="form"><div class="field"><label>Data</label><input name="date" type="date" required value="'+(x?.date||today())+'"></div><div class="field"><label>KM atual</label><input name="km" type="number" min="0" required value="'+(x?.km??km())+'"></div><div class="field full"><label>Peça trocada / serviço realizado</label><input name="item" required value="'+esc(x?.item||"")+'" placeholder="Ex.: troca de óleo e filtro"></div><div class="field"><label>Preço (R$)</label><input name="price" type="number" min="0" step=".01" required value="'+(x?.price??"")+'"></div><div class="field"><label>Tipo</label><select name="type"><option>Preventiva</option><option>Corretiva</option><option>Revisão</option><option>Pneu</option></select></div><div class="field"><label>Loja / oficina</label><input name="store" value="'+esc(x?.store||"")+'"></div><div class="field"><label>Telefone</label><input name="phone" type="tel" value="'+esc(x?.phone||"")+'"></div><div class="field"><label>Próxima troca (km)</label><input name="nextKm" type="number" min="0" value="'+(x?.nextKm||"")+'"></div><div class="field"><label>Próxima troca (data)</label><input name="nextDate" type="date" value="'+(x?.nextDate||"")+'"></div><div class="field full"><label>Observações / garantia</label><textarea name="notes">'+esc(x?.notes||"")+'</textarea></div><div class="submit"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Salvar</button></div></form>');$("cancel").onclick=close;$("mf").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o={id:id||uid(),date:f.get("date"),km:+f.get("km"),item:f.get("item"),price:+f.get("price"),type:f.get("type"),store:f.get("store"),phone:f.get("phone"),nextKm:f.get("nextKm")?+f.get("nextKm"):null,nextDate:f.get("nextDate"),notes:f.get("notes")};db.maint=id?db.maint.map(a=>a.id===id?o:a):db.maint.concat(o);save();close();toast("Manutenção salva")}}
function expForm(id){let x=id&&db.exp.find(a=>a.id===id);let cats=["IPVA","Seguro","Lavagem","Estacionamento","Pedágio","Acessórios","Documentação","Multa","Outro"];modal(id?"Editar despesa":"Nova despesa",'<form id="ef" class="form"><div class="field"><label>Data</label><input name="date" type="date" required value="'+(x?.date||today())+'"></div><div class="field"><label>KM</label><input name="km" type="number" min="0" value="'+(x?.km||km())+'"></div><div class="field"><label>Categoria</label><select name="cat">'+cats.map(c=>'<option '+(x?.cat===c?"selected":"")+'>'+c+'</option>').join("")+'</select></div><div class="field"><label>Valor (R$)</label><input name="price" type="number" min="0" step=".01" required value="'+(x?.price??"")+'"></div><div class="field full"><label>Descrição</label><input name="desc" required value="'+esc(x?.desc||"")+'"></div><div class="field full"><label>Observações</label><textarea name="notes">'+esc(x?.notes||"")+'</textarea></div><div class="submit"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Salvar</button></div></form>');$("cancel").onclick=close;$("ef").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o={id:id||uid(),date:f.get("date"),km:+f.get("km")||0,cat:f.get("cat"),price:+f.get("price"),desc:f.get("desc"),notes:f.get("notes")};db.exp=id?db.exp.map(a=>a.id===id?o:a):db.exp.concat(o);save();close();toast("Despesa salva")}}
function del(type,id){if(confirm("Excluir este registro?")){db[type]=db[type].filter(a=>a.id!==id);save();toast("Registro excluído")}}
function renderVehicle(){let v=db.vehicle;if(!v){$("vehicle").innerHTML='<div class="herorow"><h2>Cadastre sua moto</h2><p class="muted">Informe marca, modelo e ano para começar.</p><button class="btn primary" onclick="vehicleForm()">Cadastrar</button></div>';return}$("vehicle").innerHTML='<div class="herorow"><div><div class="ey">VEÍCULO</div><h2>'+esc(v.brand)+" "+esc(v.model)+'</h2><div class="muted">'+v.yf+"/"+v.ym+(v.plate?" · "+esc(v.plate):"")+'</div></div><div class="km">'+km().toLocaleString("pt-BR")+'<small>KM ATUAL</small></div></div>'}
function renderDash(){let m=new Date().toISOString().slice(0,7),f=db.fuel.filter(x=>x.date.startsWith(m)).reduce((a,x)=>a+x.total,0),ma=db.maint.filter(x=>x.date.startsWith(m)).reduce((a,x)=>a+x.price,0),ex=db.exp.filter(x=>x.date.startsWith(m)).reduce((a,x)=>a+x.price,0),last=db.fuel.slice().sort((a,b)=>b.km-a.km)[0],due=db.maint.filter(x=>x.nextKm&&x.nextKm<=km()+500);$("dash").innerHTML='<div class="head"><h2>Visão geral</h2><button class="btn primary" onclick="fuelForm()">＋ Abastecimento</button></div>'+(due.length?'<div class="alert">⚠️ '+due.length+" manutenção(ões) próxima(s) por quilometragem.</div>":"")+'<div class="grid"><div class="card stat"><span>GASTOS NO MÊS</span><b>'+money(f+ma+ex)+'</b></div><div class="card stat"><span>COMBUSTÍVEL</span><b>'+money(f)+'</b></div><div class="card stat"><span>MANUTENÇÃO</span><b>'+money(ma)+'</b></div><div class="card stat"><span>ÚLTIMO CONSUMO</span><b>'+(last?.consumption?last.consumption.toFixed(2)+" km/L":"—")+'</b></div></div><div class="card" style="margin-top:10px"><b>Próximas manutenções</b>'+(due.length?due.slice(0,5).map(x=>'<div class="meta" style="margin-top:9px">🔧 '+esc(x.item)+" — "+x.nextKm.toLocaleString("pt-BR")+" km</div>").join(""):'<div class="empty">Nenhuma manutenção próxima.</div>')+'</div>'}
function renderFuel(){let a=db.fuel.slice().sort((x,y)=>y.km-x.km);$("fuel").innerHTML='<div class="head"><h2>Abastecimentos</h2><button class="btn primary" onclick="fuelForm()">＋ Adicionar</button></div><div class="list">'+(a.length?a.map(x=>'<div class="card row"><div><h3>⛽ '+dateBR(x.date)+" · "+x.km.toLocaleString("pt-BR")+' km</h3><div class="meta">'+esc(x.type)+(x.station?" · "+esc(x.station):"")+"<br>"+x.liters.toFixed(2)+" L × "+money(x.pl)+"/L"+(x.distance?" · "+x.distance.toLocaleString("pt-BR")+" km desde o anterior":"")+(x.notes?"<br>"+esc(x.notes):"")+'</div><div class="actions"><button class="btn small" onclick="fuelForm(\''+x.id+"\')">✏️</button><button class="btn small danger" onclick="del('fuel','"+x.id+"')">🗑️</button></div></div><div class="value">'+money(x.total)+'<br><span style="color:var(--green)">'+(x.consumption?x.consumption.toFixed(2)+" km/L":"—")+"</span></div></div>").join(""):'<div class="card empty">Nenhum abastecimento cadastrado.</div>')+'</div>'}
function renderMaint(){let a=db.maint.slice().sort((x,y)=>y.km-x.km);$("maint").innerHTML='<div class="head"><h2>Manutenções</h2><button class="btn primary" onclick="maintForm()">＋ Adicionar</button></div><div class="list">'+(a.length?a.map(x=>'<div class="card row"><div><h3>🔧 '+esc(x.item)+'</h3><div class="meta">'+dateBR(x.date)+" · "+x.km.toLocaleString("pt-BR")+" km · "+esc(x.type)+(x.store?" · "+esc(x.store):"")+(x.phone?" · "+esc(x.phone):"")+(x.nextKm?"<br>Próxima: "+x.nextKm.toLocaleString("pt-BR")+" km"+(x.nextKm<=km()?" · <b style='color:var(--red)'>vencida</b>":""):"")+(x.nextDate?" · "+dateBR(x.nextDate):"")+(x.notes?"<br>"+esc(x.notes):"")+'</div><div class="actions"><button class="btn small" onclick="maintForm(\''+x.id+"\')">✏️</button><button class="btn small danger" onclick="del('maint','"+x.id+"')">🗑️</button></div></div><div class="value">'+money(x.price)+"</div></div>").join(""):'<div class="card empty">Nenhuma manutenção cadastrada.</div>')+'</div>'}
function renderExp(){let a=db.exp.slice().sort((x,y)=>new Date(y.date)-new Date(x.date));$("exp").innerHTML='<div class="head"><h2>Outras despesas</h2><button class="btn primary" onclick="expForm()">＋ Adicionar</button></div><div class="list">'+(a.length?a.map(x=>'<div class="card row"><div><h3>💰 '+esc(x.desc)+'</h3><div class="meta">'+dateBR(x.date)+" · "+esc(x.cat)+(x.km?" · "+x.km.toLocaleString("pt-BR")+" km":"")+(x.notes?"<br>"+esc(x.notes):"")+'</div><div class="actions"><button class="btn small" onclick="expForm(\''+x.id+"\')">✏️</button><button class="btn small danger" onclick="del('exp','"+x.id+"')">🗑️</button></div></div><div class="value">'+money(x.price)+"</div></div>").join(""):'<div class="card empty">Nenhuma despesa cadastrada.</div>')+'</div>'}
function renderHist(){let a=[...db.fuel.map(x=>({k:"fuel",d:x.date,t:"⛽ "+x.type,p:x.total,km:x.km})),...db.maint.map(x=>({k:"maint",d:x.date,t:"🔧 "+x.item,p:x.price,km:x.km})),...db.exp.map(x=>({k:"exp",d:x.date,t:"💰 "+x.desc,p:x.price,km:x.km}))].sort((x,y)=>new Date(y.d)-new Date(x.d));$("hist").innerHTML='<div class="head"><h2>Histórico</h2></div><div class="filters"><input id="search" placeholder="Buscar no histórico" oninput="filterHist()"><select id="type" onchange="filterHist()"><option value="">Todos</option><option value="fuel">Abastecimentos</option><option value="maint">Manutenções</option><option value="exp">Despesas</option></select></div><div id="hl" class="list">'+(a.length?a.map(x=>'<div class="card row hi" data-k="'+x.k+'" data-s="'+esc(x.t.toLowerCase())+'"><div><h3>'+esc(x.t)+'</h3><div class="meta">'+dateBR(x.d)+" · "+(x.km||0).toLocaleString("pt-BR")+" km</div></div><div class="value">"+money(x.p)+"</div></div>").join(""):'<div class="card empty">Ainda não há registros.</div>')+'</div>'}
function filterHist(){let q=$("search").value.toLowerCase(),t=$("type").value;document.querySelectorAll(".hi").forEach(x=>x.style.display=(!q||x.dataset.s.includes(q))&&(!t||x.dataset.k===t)?"flex":"none")}
function render(){renderVehicle();renderDash();renderFuel();renderMaint();renderExp();renderHist()}
$("cfg").onclick=()=>modal("Configurações",'<div class="card"><b>Armazenamento local</b><p class="muted">Os dados ficam somente neste navegador. Nenhuma informação é enviada para servidor nesta versão.</p><div class="actions"><button class="btn secondary" onclick="vehicleForm()">🏍️ Editar moto</button><button class="btn" onclick="exportData()">⬇️ Backup</button><button class="btn danger" onclick="resetData()">Apagar tudo</button></div></div>');
function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="moto-backup.json";a.click();URL.revokeObjectURL(a.href)}
function resetData(){if(confirm("Apagar todos os dados desta moto?")){localStorage.removeItem(KEY);location.reload()}}
render();
</script></body></html>
