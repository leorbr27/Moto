<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moto — Abastecimento</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="ey">CONTROLE DA MOTO</div><h1>🏍️ Novo abastecimento</h1></header><main><nav class="nav"><a class="on" data-p="fuel" href="index.html">⛽ Abastecer</a><a data-p="maint" href="manutencao.html">🔧 Manutenção</a><a data-p="exp" href="despesas.html">💰 Despesas</a><a data-p="hist" href="historico.html">📋 Histórico</a><a data-p="moto" href="moto.html">🏍️ Minha moto</a></nav><section class="card"><div class="head"><h2 id="formTitle">Registrar abastecimento</h2></div><form id="form" class="form" style="margin-top:14px"><div class="field"><label>Data</label><input name="date" type="date" required></div><div class="field"><label>Quilometragem (km)</label><input name="km" type="number" inputmode="numeric" pattern="[0-9]*" min="0" required></div><div class="field"><label>Valor abastecido (R$)</label><input name="total" type="number" inputmode="decimal" min="0" step=".01" required></div><div class="field"><label>Preço por litro (R$)</label><input name="pl" type="number" inputmode="decimal" min=".001" step=".001" required></div><div class="field"><label>Combustível</label><select name="type"><option>Gasolina comum</option><option>Gasolina aditivada</option><option>Etanol</option><option>Gasolina premium</option></select></div><div class="field"><label>Posto</label><input name="station"></div><div class="field"><label>Observações</label><textarea name="notes"></textarea></div><div class="actions form-actions"><button id="saveBtn" class="btn primary">💾 Salvar abastecimento</button><button id="cancelBtn" type="button" class="btn secondary" hidden>Cancelar edição</button></div></form></section><section><div class="section-title">Abastecimentos</div><div id="list"></div></section></main><footer class="updated">Última atualização: <span id="updatedAt"></span></footer><div id="toast" class="toast"></div><script src="app.js"></script><script>
const f=document.getElementById("form");const kmInput=f.km,totalInput=f.total,plInput=f.pl,typeInput=f.type,stationInput=f.station,notesInput=f.notes;let ready=false,editingId=null;
function setUpdated(){document.getElementById("updatedAt").textContent=new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}
function resetForm(){editingId=null;document.getElementById("formTitle").textContent="Registrar abastecimento";document.getElementById("saveBtn").textContent="💾 Salvar abastecimento";document.getElementById("cancelBtn").hidden=true;f.reset();f.date.value=today();const lastFuel=db.fuel.slice().sort((a,b)=>b.km-a.km)[0];kmInput.value=lastFuel?.km??currentKm();if(lastFuel){totalInput.value=lastFuel.total;plInput.value=lastFuel.pl;typeInput.value=lastFuel.type||typeInput.value;stationInput.value=lastFuel.station||"";notesInput.value=lastFuel.notes||""}}
function init(){if(!ready){ready=true;resetForm()}renderList();setUpdated()}
function editFuel(id){const x=db.fuel.find(item=>item.id===id);if(!x)return;editingId=id;document.getElementById("formTitle").textContent="Editar abastecimento";document.getElementById("saveBtn").textContent="💾 Salvar alterações";document.getElementById("cancelBtn").hidden=false;f.date.value=x.date;kmInput.value=x.km;totalInput.value=x.total;plInput.value=x.pl;typeInput.value=x.type||typeInput.value;stationInput.value=x.station||"";notesInput.value=x.notes||"";window.scrollTo({top:0,behavior:"smooth"})}
async function submit(e){e.preventDefault();const d=new FormData(f);const payload={date:d.get("date"),km:+d.get("km"),total:+d.get("total"),pl:+d.get("pl"),type:d.get("type"),station:d.get("station"),notes:d.get("notes")};if(editingId){await updateFuel(editingId,payload);toast("Abastecimento atualizado no Neon")}else{await createFuel(payload);toast("Abastecimento salvo no Neon")}resetForm();renderList()}
function renderList(){const list=document.getElementById("list");const a=db.fuel.slice().sort((x,y)=>y.km-x.km);list.innerHTML=a.length?a.map(x=>'<div class="card item"><div class="item-main"><b>⛽ '+esc(x.type||"Abastecimento")+'</b><div class="meta">'+dateBR(x.date)+' · '+x.km.toLocaleString("pt-BR")+' km'+(x.station?' · '+esc(x.station):'')+'<br>'+x.liters.toFixed(2)+' L · '+(x.pl||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})+'/L'+(x.consumption?' · '+x.consumption.toFixed(2)+' km/L':'')+'</div><div class="actions"><button class="btn edit" onclick="editFuel(\''+x.id+'\')">✏️ Editar</button><button class="btn danger" onclick="del(\'fuel\',\''+x.id+'\')">🗑️ Excluir</button></div></div><div class="value">'+money(x.total)+'</div></div>').join(""):'<div class="card empty">Nenhum abastecimento cadastrado.</div>'}
f.onsubmit=async e=>{try{await submit(e)}catch(err){console.error(err);toast(err.message||"Não foi possível salvar no Neon")}};document.getElementById("cancelBtn").onclick=resetForm;window.addEventListener("moto:ready",init);window.addEventListener("moto:error",()=>{init();toast("Neon indisponível: verifique a conexão")});setUpdated();
</script></body></html>
