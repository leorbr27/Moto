<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moto — Abastecimento</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="ey">CONTROLE DA MOTO</div><h1>🏍️ Novo abastecimento</h1></header><main><nav class="nav"><a data-p="fuel" href="index.html">⛽ Abastecer</a><a data-p="maint" href="manutencao.html">🔧 Manutenção</a><a data-p="exp" href="despesas.html">💰 Despesas</a><a data-p="hist" href="historico.html">📋 Histórico</a><a data-p="moto" href="moto.html">🏍️ Minha moto</a></nav><section class="card"><div class="head"><h2>Registrar abastecimento</h2></div><form id="form" class="form" style="margin-top:14px"><div class="field"><label>Data</label><input name="date" type="date" required></div><div class="field"><label>Quilometragem (km)</label><input name="km" type="number" inputmode="numeric" pattern="[0-9]*" min="0" required></div><div class="field"><label>Valor abastecido (R$)</label><input name="total" type="number" inputmode="decimal" min="0" step=".01" required></div><div class="field"><label>Preço por litro (R$)</label><input name="pl" type="number" inputmode="decimal" min=".001" step=".001" required></div><div class="field"><label>Combustível</label><select name="type"><option>Gasolina comum</option><option>Gasolina aditivada</option><option>Etanol</option><option>Gasolina premium</option></select></div><div class="field"><label>Posto</label><input name="station"></div><div class="field"><label>Observações</label><textarea name="notes"></textarea></div><button class="btn primary">💾 Salvar abastecimento</button></form></section><section id="last"></section></main><div id="toast" class="toast"></div><script src="app.js"></script><script>
nav("fuel");let ready=false;const f=document.getElementById("form");const kmInput=f.km,totalInput=f.total,plInput=f.pl,typeInput=f.type,stationInput=f.station,notesInput=f.notes;
function init(){if(ready)return;ready=true;const lastFuel=db.fuel.slice().sort((a,b)=>b.km-a.km)[0];f.date.value=today();kmInput.value=lastFuel?.km??currentKm();if(lastFuel){totalInput.value=lastFuel.total;plInput.value=lastFuel.pl;typeInput.value=lastFuel.type||typeInput.value;stationInput.value=lastFuel.station||"";notesInput.value=lastFuel.notes||"";}renderLast()}
async function submit(e){e.preventDefault();const d=new FormData(f);const x=await createFuel({date:d.get("date"),km:+d.get("km"),total:+d.get("total"),pl:+d.get("pl"),type:d.get("type"),station:d.get("station"),notes:d.get("notes")});toast("Abastecimento salvo no Neon");f.reset();f.date.value=today();f.km.value=x.km;f.total.value=x.total;f.pl.value=x.pl;f.type.value=x.type||typeInput.value;f.station.value=x.station||"";f.notes.value=x.notes||"";renderLast()}
function renderLast(){const x=db.fuel.slice().sort((a,b)=>b.km-a.km)[0];document.getElementById("last").innerHTML=x?'<div class="card"><b>Último abastecimento</b><div class="meta">'+dateBR(x.date)+' · '+x.km.toLocaleString("pt-BR")+' km · '+x.liters.toFixed(2)+' L</div><div class="value" style="margin-top:6px">'+money(x.total)+(x.consumption?' · '+x.consumption.toFixed(2)+' km/L':'')+'</div></div>':''}
f.onsubmit=async e=>{try{await submit(e)}catch(err){toast("Não foi possível salvar no Neon")}};window.addEventListener("moto:ready",init);window.addEventListener("moto:error",init);
</script></body></html>
