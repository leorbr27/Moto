<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Controle da Moto</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="ey">CONTROLE DA MOTO</div>
  <div class="top-row"><div><h1>🏍️ Controle da Moto</h1><p>Abastecimentos e consumo</p></div><button id="refreshBtn" class="btn ghost">🔄 Atualizar</button></div>
</header>
<main>
  <section id="status" class="status" hidden></section>
  <section class="metrics" id="metrics"></section>

  <section class="card">
    <div class="section-head"><div><span class="ey dark">ABASTECIMENTO</span><h2 id="formTitle">Novo abastecimento</h2></div></div>
    <form id="fuelForm" class="form" novalidate>
      <div class="grid two">
        <label>Data<input name="date" type="date" required></label>
        <label>Quilometragem (km)<input name="km" type="number" inputmode="numeric" pattern="[0-9]*" min="0" step="1" required></label>
      </div>
      <div class="grid two">
        <label>Valor abastecido (R$)<input name="total" type="number" inputmode="decimal" min="0.01" step="0.01" required></label>
        <label>Preço por litro (R$)<input name="price" type="number" inputmode="decimal" min="0.001" step="0.001" required></label>
      </div>
      <div class="grid two">
        <label>Litros <input name="liters" type="number" inputmode="decimal" min="0.001" step="0.001" readonly></label>
        <label>Combustível<select name="fuel" required><option>Gasolina comum</option><option>Gasolina aditivada</option><option>Etanol</option><option>Outro</option></select></label>
      </div>
      <label>Posto<input name="station" type="text" maxlength="120"></label>
      <label>Observações<textarea name="notes" rows="3" maxlength="500"></textarea></label>
      <div class="form-actions"><button id="saveBtn" class="btn primary" type="submit">💾 Salvar abastecimento</button><button id="cancelBtn" class="btn secondary" type="button" hidden>Cancelar</button></div>
    </form>
  </section>

  <section>
    <div class="section-head list-head"><h2>Histórico de abastecimentos</h2><span id="countLabel"></span></div>
    <div id="fuelList"></div>
  </section>
</main>
<footer>Última atualização: <strong id="updatedAt">—</strong></footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
