<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moto — Manutenção</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="ey">CONTROLE DA MOTO</div><h1>🔧 Manutenção</h1></header><main><nav class="nav"><a href="index.html">⛽ Abastecer</a><a class="on" href="manutencao.html">🔧 Manutenção</a><a href="despesas.html">💰 Despesas</a><a href="historico.html">📋 Histórico</a><a href="moto.html">🏍️ Minha moto</a></nav><section class="card"><h2>Nova manutenção</h2><form id="form" class="form"><div class="field"><label>Data</label><input name="date" type="date" required></div><div class="field"><label>KM atual</label><input name="km" type="number" min="0" required></div><div class="field"><label>Peça / serviço</label><input name="item" required placeholder="Troca de óleo e filtro"></div><div class="field"><label>Preço (R$)</label><input name="price" type="number" min="0" step=".01" required></div><div class="field"><label>Tipo</label><select name="type"><option>Preventiva</option><option>Corretiva</option><option>Revisão</option><option>Pneu</option></select></div><div class="field"><label>Loja / oficina</label><input name="store"></div><div class="field"><label>Telefone</label><input name="phone" type="tel"></div><div class="field"><label>Próxima troca (KM)</label><input name="nextKm" type="number" min="0"></div><div class="field"><label>Próxima troca (data)</label><input name="nextDate" type="date"></div><div class="field"><label>Observações / garantia</label><textarea name="notes"></textarea></div><button class="btn primary">💾 Salvar manutenção</button></form></section><section id="list"></section></main><div id="toast" class="toast"></div><script src="app.js"></script><script>
const f=document.getElementById("form");function init(){f.date.value=today();f.km.value=currentKm();render()}async function submit(e){e.preventDefault();const d=new FormData(f);await createMaintenance({date:d.get("date"),km:+d.get("km"),item:d.get("item"),price:+d.get("price"),type:d.get("type"),store:d.get("store"),phone:d.get("phone"),nextKm:d.get("nextKm"),nextDate:d.get("nextDate"),notes:d.get("notes")});toast("Manutenção salva no Neon");f.reset();f.date.value=today();f.km.value=currentKm();render()}function render(){document.getElementById("list").innerHTML=db.maint.length?db.maint.slice().sort((a,b)=>b.km-a.km).map(x=>'<div class="card item"><div><b>🔧 '+esc(x.item)+'</b><div class="meta">'+dateBR(x.date)+' · '+x.km.toLocaleString("pt-BR")+' km · '+esc(x.type)+(x.store?' · '+esc(x.store):'')+(x.nextKm?'<br>Próxima: '+x.nextKm.toLocaleString("pt-BR")+' km':'')+'</div><div class="actions"><button class="btn danger" onclick="del(\'maint\',\''+x.id+'\')">🗑️ Excluir</button></div></div><div class="value">'+money(x.price)+'</div></div>').join(""):'<div class="card empty">Nenhuma manutenção cadastrada.</div>'}f.onsubmit=async e=>{try{await submit(e)}catch(err){toast("Não foi possível salvar no Neon")}};window.addEventListener("moto:ready",init);window.addEventListener("moto:error",init);
</script></body></html>
