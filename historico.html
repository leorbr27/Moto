<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moto — Histórico</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="ey">CONTROLE DA MOTO</div><h1>📋 Histórico</h1></header><main><nav class="nav"><a href="index.html">⛽ Abastecer</a><a href="manutencao.html">🔧 Manutenção</a><a href="despesas.html">💰 Despesas</a><a class="on" href="historico.html">📋 Histórico</a><a href="moto.html">🏍️ Minha moto</a></nav><section class="card"><h2>Todos os lançamentos</h2><input id="q" placeholder="Buscar..." oninput="render()" style="margin-top:12px"></section><section id="list"></section></main><footer class="updated">Última atualização: <span id="updatedAt"></span></footer><script src="app.js"></script><script>document.getElementById("updatedAt").textContent=new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});</script><script>
function render(){const q=(document.getElementById("q").value||"").toLowerCase();let a=[...db.fuel.map(x=>({d:x.date,t:"⛽ "+x.type,p:x.total,k:x.km,s:x.station||""})),...db.maint.map(x=>({d:x.date,t:"🔧 "+x.item,p:x.price,k:x.km,s:x.store||""})),...db.exp.map(x=>({d:x.date,t:"💰 "+x.desc,p:x.price,k:x.km,s:x.cat||""}))].sort((a,b)=>new Date(b.d)-new Date(a.d)).filter(x=>(x.t+" "+x.s).toLowerCase().includes(q));document.getElementById("list").innerHTML=a.length?a.map(x=>'<div class="card item"><div><b>'+esc(x.t)+'</b><div class="meta">'+dateBR(x.d)+' · '+(x.k||0).toLocaleString("pt-BR")+' km · '+esc(x.s)+'</div></div><div class="value">'+money(x.p)+'</div></div>').join(""):'<div class="card empty">Nenhum registro encontrado.</div>'}
window.addEventListener("moto:ready",render);window.addEventListener("moto:error",render);
</script></body></html>
