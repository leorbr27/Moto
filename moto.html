<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moto — Cadastro</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="ey">CONTROLE DA MOTO</div><h1>🏍️ Minha moto</h1></header><main><nav class="nav"><a href="index.html">⛽ Abastecer</a><a href="manutencao.html">🔧 Manutenção</a><a href="despesas.html">💰 Despesas</a><a href="historico.html">📋 Histórico</a><a class="on" href="moto.html">🏍️ Minha moto</a></nav><section class="card"><form id="form" class="form"><div class="field"><label>Marca</label><input name="brand" required></div><div class="field"><label>Modelo</label><input name="model" required></div><div class="field"><label>Ano de fabricação</label><input name="yf" type="number" required></div><div class="field"><label>Ano do modelo</label><input name="ym" type="number" required></div><div class="field"><label>Placa</label><input name="plate"></div><div class="field"><label>KM atual/inicial</label><input name="ikm" type="number" min="0"></div><div class="field"><label>Combustível</label><select name="ft"><option>Gasolina</option><option>Etanol</option><option>Flex</option></select></div><div class="field"><label>Observações</label><textarea name="notes"></textarea></div><button class="btn primary">💾 Salvar moto</button></form></section></main><div id="toast" class="toast"></div><script src="app.js"></script><script>
const f=document.getElementById("form");function init(){const v=db.vehicle||{};Object.keys(v).forEach(k=>{if(f[k])f[k].value=v[k]})}f.onsubmit=async e=>{e.preventDefault();try{const d=new FormData(f);await saveVehicle({brand:d.get("brand"),model:d.get("model"),yf:+d.get("yf"),ym:+d.get("ym"),plate:d.get("plate"),ikm:+d.get("ikm")||0,ft:d.get("ft"),notes:d.get("notes")});toast("Dados da moto salvos no Neon")}catch(err){toast("Não foi possível salvar no Neon")}};window.addEventListener("moto:ready",init);window.addEventListener("moto:error",init);
</script></body></html>
