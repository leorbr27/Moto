<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Dashboard da Moto</title><link rel="stylesheet" href="style.css"><style>.nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.nav a{color:#e5e7eb;text-decoration:none;font-size:12px;font-weight:750;background:#ffffff12;border:1px solid #ffffff24;border-radius:10px;padding:9px 10px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:15px;margin-bottom:12px;box-shadow:0 3px 12px #00000006}.panel h2{margin:0 0 12px}.barrow{display:grid;grid-template-columns:minmax(90px,1fr) 2fr auto;gap:10px;align-items:center;margin:12px 0;font-size:12px}.track{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:#2563eb;border-radius:99px}.big{font-size:26px;font-weight:900}.muted{font-size:12px;color:#64748b;line-height:1.6}.line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #e5e7eb;font-size:13px}.line:last-child{border:0}</style></head><body><header class="top"><div class="ey">CONTROLE DA MOTO</div><div class="top-row"><div><h1>📊 Dashboard</h1><p>Visão geral dos custos e do consumo</p></div></div><nav class="nav"><a href="index.html">🏍️ Abastecimento</a><a href="manutencao.html">🔧 Manutenção</a><a href="despesas.html">💰 Despesas</a><a href="historico.html">📋 Histórico</a></nav></header><main><section id="status" class="status" hidden></section><label for="month">Período do dashboard<input id="month" type="month"></label><section id="metrics" class="metrics" style="margin-top:12px"></section><section class="panel"><span class="ey dark">CUSTOS DO PERÍODO</span><div id="total" class="big">—</div><p id="caption" class="muted"></p><div id="breakdown"></div></section><section class="panel"><h2>Despesas por categoria</h2><div id="chart"></div></section><section class="panel"><h2>Resumo dos registros</h2><div id="summary"></div></section><p class="muted">Dados carregados do Neon. Os custos de abastecimento, manutenção e despesas gerais são apresentados separadamente.</p></main><script>(()=>{const API='https://br-noisy-resonance-b594p7s8-motoapi.compute.c-7.us-east-2.aws.neon.tech',month=document.getElementById('month'),status=document.getElementById('status'),metrics=document.getElementById('metrics'),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),num=v=>Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:1}),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let fuel=[],expense=[],maint=[];let d=new Date();month.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');async function get(p){let r=await fetch(API+p),t=await r.text(),v;try{v=t?JSON.parse(t):null}catch{v=t}if(!r.ok)throw Error(v?.message||'HTTP '+r.status);return Array.isArray(v)?v:v?.data||[]}function same(v,m){return String(v||'').slice(0,7)===m}function render(){let m=month.value||'',f=fuel.filter(r=>same(r.data_abastecimento,m)),e=expense.filter(r=>same(r.data_despesa,m)),a=maint.filter(r=>same(r.data_manutencao,m)),ft=f.reduce((s,r)=>s+Number(r.valor_total||0),0),et=e.reduce((s,r)=>s+Number(r.valor||0),0),mt=a.reduce((s,r)=>s+Number(r.preco||0),0),total=ft+et+mt,liters=f.reduce((s,r)=>s+Number(r.litros||0),0),kms=f.map(r=>Number(r.quilometragem||0)),dist=kms.length>1?Math.max(...kms)-Math.min(...kms):0;metrics.innerHTML='<div class="metric"><div class="label">GASTO TOTAL</div><div class="value">'+money(total)+'</div></div><div class="metric"><div class="label">ABASTECIMENTOS</div><div class="value">'+f.length+'</div></div><div class="metric"><div class="label">LITROS</div><div class="value">'+num(liters)+' L</div></div><div class="metric"><div class="label">DISTÂNCIA</div><div class="value">'+num(dist)+' km</div></div>';document.getElementById('total').textContent=money(total);let [y,mo]=m.split('-').map(Number);document.getElementById('caption').textContent='Total em '+new Date(y,mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+'.';document.getElementById('breakdown').innerHTML=[['Abastecimentos',ft,f.length],['Manutenção',mt,a.length],['Despesas gerais',et,e.length]].map(x=>'<div class="line"><span>'+x[0]+' <span class="muted">('+x[2]+')</span></span><strong>'+money(x[1])+'</strong></div>').join('');let cats={};e.forEach(r=>{let c=r.categoria||'Outros';cats[c]=(cats[c]||0)+Number(r.valor||0)});let entries=Object.entries(cats).sort((x,y)=>y[1]-x[1]),max=Math.max(1,...entries.map(x=>x[1]));document.getElementById('chart').innerHTML=entries.length?entries.map(([c,v])=>'<div class="barrow"><span>'+esc(c)+'</span><div class="track"><div class="bar" style="width:'+Math.max(1,v/max*100)+'%"></div></div><strong>'+money(v)+'</strong></div>').join(''):'<div class="empty">Sem despesas gerais neste período.</div>';document.getElementById('summary').innerHTML=[['Abastecimentos registrados',fuel.length],['Manutenções registradas',maint.length],['Despesas gerais registradas',expense.length],['Preço médio por litro no período',liters?money(ft/liters):'—']].map(x=>'<div class="line"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('')}async function load(){status.hidden=true;try{[fuel,expense,maint]=await Promise.all([get('/abastecimentos'),get('/despesas'),get('/manutencoes')]);render()}catch(e){status.textContent='Não foi possível carregar todos os dados: '+e.message;status.className='status error';status.hidden=false;render()}}month.addEventListener('change',render);load()})();</script></body></html>
