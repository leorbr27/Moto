<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moto — Despesas</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="ey">CONTROLE DA MOTO</div><h1>💰 Despesas</h1></header><main><nav class="nav"><a href="index.html">⛽ Abastecer</a><a href="manutencao.html">🔧 Manutenção</a><a class="on" href="despesas.html">💰 Despesas</a><a href="historico.html">📋 Histórico</a><a href="moto.html">🏍️ Minha moto</a></nav><section class="card"><h2>Nova despesa</h2><form id="form" class="form"><div class="field"><label>Data</label><input name="date" type="date" required></div><div class="field"><label>KM</label><input name="km" type="number" min="0"></div><div class="field"><label>Categoria</label><select name="cat"><option>IPVA</option><option>Seguro</option><option>Lavagem</option><option>Estacionamento</option><option>Pedágio</option><option>Acessórios</option><option>Documentação</option><option>Multa</option><option>Outro</option></select></div><div class="field"><label>Valor (R$)</label><input name="price" type="number" min="0" step=".01" required></div><div class="field"><label>Descrição</label><input name="desc" required></div><div class="field"><label>Observações</label><textarea name="notes"></textarea></div><button class="btn primary">💾 Salvar despesa</button></form></section><section id="list"></section></main><footer class="updated">Última atualização: <span id="updatedAt"></span></footer><div id="toast" class="toast"></div><script src="app.js"></script><script>document.getElementById("updatedAt").textContent=new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});</script><script>
const f=document.getElementById("form");function init(){f.date.value=today();f.km.value=currentKm();render()}async function submit(e){e.preventDefault();const d=new FormData(f);await createExpense({date:d.get("date"),km:+d.get("km")||0,cat:d.get("cat"),price:+d.get("price"),desc:d.get("desc"),notes:d.get("notes")});toast("Despesa salva no Neon");f.reset();f.date.value=today();f.km.value=currentKm();render()}function render(){document.getElementById("list").innerHTML=db.exp.length?db.exp.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(x=>'<div class="card item"><div><b>💰 '+esc(x.desc)+'</b><div class="meta">'+dateBR(x.date)+' · '+esc(x.cat)+(x.km?' · '+x.km.toLocaleString("pt-BR")+' km':'')+'</div><div class="actions"><button class="btn danger" onclick="del(\'exp\',\''+x.id+'\')">🗑️ Excluir</button></div></div><div class="value">'+money(x.price)+'</div></div>').join(""):'<div class="card empty">Nenhuma despesa cadastrada.</div>'}f.onsubmit=async e=>{try{await submit(e)}catch(err){toast("Não foi possível salvar no Neon")}};window.addEventListener("moto:ready",init);window.addEventListener("moto:error",init);
</script></body></html>
