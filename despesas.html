<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Despesas da Moto</title><link rel="stylesheet" href="style.css"><style>.nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.nav a{color:#e5e7eb;text-decoration:none;font-size:12px;font-weight:750;background:#ffffff12;border:1px solid #ffffff24;border-radius:10px;padding:9px 10px}.item{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:14px;margin-bottom:9px}.mainrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}.meta{color:#64748b;font-size:12px;line-height:1.6;margin-top:5px}.price{font-size:17px;font-weight:900;white-space:nowrap}.actions{display:flex;gap:7px;margin-top:10px}.actions .btn{min-height:36px;padding:7px 10px;font-size:12px}.tag{display:inline-block;background:#e0f2fe;color:#075985;border-radius:8px;padding:4px 7px;font-size:11px;font-weight:800;margin-top:6px}</style></head><body><header class="top"><div class="ey">CONTROLE DA MOTO</div><div class="top-row"><div><h1>💰 Despesas</h1><p>IPVA, multas, seguro e outros custos</p></div></div><nav class="nav"><a href="index.html">🏍️ Abastecimento</a><a href="manutencao.html">🔧 Manutenção</a><a href="dashboard.html">📊 Dashboard</a><a href="historico.html">📋 Histórico</a></nav></header><main><section id="status" class="status" hidden></section><section id="metrics" class="metrics"></section><section class="card"><div class="section-head"><div><span class="ey dark">REGISTRO</span><h2 id="formTitle">Nova despesa</h2></div></div><form id="form" class="form" novalidate><div class="grid two"><label>Data<input name="data_despesa" type="date" required></label><label>Categoria<select name="categoria"><option>IPVA</option><option>Multas</option><option>Licenciamento</option><option>Seguro</option><option>Documentação</option><option>Estacionamento</option><option>Acessórios</option><option>Lavagem</option><option>Pedágio</option><option>Outros</option></select></label></div><label>Descrição<input name="descricao" maxlength="180" required placeholder="Ex.: seguro anual"></label><div class="grid two"><label>Valor (R$)<input name="valor" type="number" inputmode="decimal" min="0.01" step="0.01" required></label><label>Quilometragem (km)<input name="quilometragem" type="number" inputmode="numeric" min="0" step="1" placeholder="Opcional"></label></div><label>Observações<textarea name="observacoes" rows="3" maxlength="1000"></textarea></label><div class="form-actions"><button id="save" class="btn primary" type="submit">💾 Salvar despesa</button><button id="cancel" class="btn secondary" type="button" hidden>Cancelar</button></div></form></section><section><div class="section-head list-head"><h2>Despesas registradas</h2><span id="count"></span></div><div id="list"></div></section></main><div id="toast" class="toast" role="status" aria-live="polite"></div><script>(()=>{const API='https://br-noisy-resonance-b594p7s8-motoapi.compute.c-7.us-east-2.aws.neon.tech',form=document.getElementById('form'),list=document.getElementById('list'),status=document.getElementById('status'),metrics=document.getElementById('metrics'),save=document.getElementById('save'),cancel=document.getElementById('cancel'),toast=document.getElementById('toast');let rows=[],editing=null;const f=n=>form.elements[n],today=()=>{let d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)},money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),date=v=>v?String(v).slice(0,10).split('-').reverse().join('/'):'—',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(s){status.textContent=s;status.className='status error';status.hidden=false}function pop(s){toast.textContent=s;toast.classList.add('show');clearTimeout(pop.t);pop.t=setTimeout(()=>toast.classList.remove('show'),2400)}async function api(path,opt={}){let m=path.match(/^\/despesas\/([^/?]+)$/),url=API+(m?'/despesas?id=eq.'+encodeURIComponent(m[1]):path),r=await fetch(url,{...opt,headers:{...(opt.body?{'Content-Type':'application/json'}:{}),...(opt.headers||{})}}),t=await r.text(),d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.message||'HTTP '+r.status);return d}function reset(){editing=null;form.reset();f('data_despesa').value=today();document.getElementById('formTitle').textContent='Nova despesa';save.textContent='💾 Salvar despesa';cancel.hidden=true}function render(){let sorted=[...rows].sort((a,b)=>String(b.data_despesa).localeCompare(String(a.data_despesa)));document.getElementById('count').textContent=sorted.length+' registro(s)';list.innerHTML=sorted.length?sorted.map(r=>'<article class="item"><div class="mainrow"><div><strong>'+esc(r.descricao)+'</strong><div class="meta">'+date(r.data_despesa)+(r.quilometragem!=null?' · '+Number(r.quilometragem).toLocaleString('pt-BR')+' km':'')+'</div><span class="tag">'+esc(r.categoria)+'</span>'+(r.observacoes?'<div class="meta">'+esc(r.observacoes)+'</div>':'')+'</div><div class="price">'+money(r.valor)+'</div></div><div class="actions"><button class="btn edit" data-edit="'+esc(r.id)+'">✏️ Editar</button><button class="btn danger" data-del="'+esc(r.id)+'">🗑️ Excluir</button></div></article>').join(''):'<div class="empty">Nenhuma despesa registrada.</div>';let total=rows.reduce((s,r)=>s+Number(r.valor||0),0),year=String(new Date().getFullYear()),annual=rows.filter(r=>String(r.data_despesa).slice(0,4)===year).reduce((s,r)=>s+Number(r.valor||0),0);metrics.innerHTML='<div class="metric"><div class="label">REGISTROS</div><div class="value">'+rows.length+'</div></div><div class="metric"><div class="label">TOTAL ACUMULADO</div><div class="value">'+money(total)+'</div></div><div class="metric"><div class="label">TOTAL '+year+'</div><div class="value">'+money(annual)+'</div></div><div class="metric"><div class="label">CATEGORIAS</div><div class="value">'+new Set(rows.map(r=>r.categoria)).size+'</div></div>'}async function load(){status.hidden=true;try{let d=await api('/despesas');rows=Array.isArray(d)?d:d?.data||[];render();reset()}catch(e){rows=[];render();msg('Falha ao carregar despesas: '+e.message)}}form.addEventListener('submit',async e=>{e.preventDefault();let p={data_despesa:f('data_despesa').value,categoria:f('categoria').value,descricao:f('descricao').value.trim(),valor:Number(f('valor').value),quilometragem:f('quilometragem').value===''?null:Number(f('quilometragem').value),observacoes:f('observacoes').value.trim()};if(!p.data_despesa||!p.descricao||!f('valor').value||p.valor<=0)return pop('Preencha data, descrição e valor.');save.disabled=true;try{await api(editing?'/despesas/'+encodeURIComponent(editing):'/despesas',{method:editing?'PATCH':'POST',body:JSON.stringify(p)});pop(editing?'Despesa atualizada.':'Despesa salva.');await load()}catch(e){msg('Erro ao salvar despesa: '+e.message)}finally{save.disabled=false}});cancel.addEventListener('click',reset);list.addEventListener('click',async e=>{let edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]');if(edit){let r=rows.find(x=>String(x.id)===edit.dataset.edit);if(!r)return;editing=r.id;for(let k of ['data_despesa','categoria','descricao','valor','quilometragem','observacoes'])f(k).value=r[k]??'';f('data_despesa').value=String(r.data_despesa).slice(0,10);document.getElementById('formTitle').textContent='Editar despesa';save.textContent='💾 Atualizar despesa';cancel.hidden=false;scrollTo({top:0,behavior:'smooth'})}if(del){if(!confirm('Excluir esta despesa?'))return;try{await api('/despesas/'+encodeURIComponent(del.dataset.del),{method:'DELETE'});pop('Despesa excluída.');await load()}catch(e){msg('Erro ao excluir despesa: '+e.message)}}});reset();load()})();</script></body></html>
